services:
  site:
    build:
      context: .
      dockerfile: Dockerfile.site
    ports:
      - "8101:80"
    restart: unless-stopped
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marinovani
      POSTGRES_DB: marinovani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marinovani -d marinovani"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  bot:
    build: ./backend
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Fill BOT_TOKEN in .env}
      OWNER_CHAT_ID: ${OWNER_CHAT_ID:?Fill OWNER_CHAT_ID in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD in .env}
      CLUB_TIMEZONE: Europe/Kaliningrad
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./backend
    command: ["python", "api.py"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Fill POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
